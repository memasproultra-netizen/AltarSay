name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unpack project
        run: |
          mkdir work
          unzip -q "$(ls *.zip | head -1)" -d work
      - name: Build
        working-directory: work/altar-mod-neoforge
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: altarmod-jar
          path: work/altar-mod-neoforge/build/libs/altarmod-*.jar
